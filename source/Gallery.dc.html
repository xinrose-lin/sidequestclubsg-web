<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; text-transform: lowercase; background: #1B2A1D; font-family: 'Inter', sans-serif; color: #3D2A1D; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { text-transform: inherit; }
  a { color: #B8492F; text-decoration: none; }
  a:hover { color: #D5A945; }
  *:focus-visible { outline: 3px solid #D5A945; outline-offset: 3px; }
  @media (max-width: 820px) {
    [data-sm-hide] { display: none !important; }
    [data-sm-tight] { font-size: 12px !important; padding: 7px 11px !important; letter-spacing: 0 !important; }
  }
</style>
</helmet>

<div style="position:relative; width:100%; overflow-x:hidden; background:#1F2F22;">

  <header style="position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:clamp(10px,2vw,14px) clamp(14px,4vw,48px); background:rgba(14,36,23,.92); backdrop-filter:blur(6px); border-bottom:3px solid #354B38;">
    <a href="SQC%20Website.dc.html" style="display:flex; align-items:center; gap:10px;">
      <img src="assets/logo-bag.png" alt="" style="height:clamp(38px,5.4vw,48px); width:auto; display:block; image-rendering:pixelated;">
      <span style="font-family:'Inter',sans-serif; font-weight:800; font-size:clamp(14px,3vw,17px); letter-spacing:.4px; color:#F4EBD8; line-height:1;">Side Quest Club</span>
    </a>
    <nav aria-label="Main" style="display:flex; align-items:center; justify-content:flex-end; gap:clamp(10px,1.6vw,22px);">
      <a href="SQC%20Website.dc.html" style="font-family:'Inter',sans-serif; font-weight:600; font-size:13px; letter-spacing:.4px; color:#B3C6B2; white-space:nowrap;" style-hover="color:#D5A945">Home</a>
      <a href="Quest%20Day.dc.html" style="font-family:'Inter',sans-serif; font-weight:600; font-size:13px; letter-spacing:.4px; color:#B3C6B2; white-space:nowrap;" style-hover="color:#D5A945">Quest Day</a>
      <span aria-current="page" style="font-family:'Inter',sans-serif; font-weight:800; font-size:13px; letter-spacing:.4px; color:#D5A945; white-space:nowrap; border-bottom:3px solid #D5A945; padding-bottom:2px;">Gallery</span>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSe41BedRCd2ouJ6u03e3gESe2nb243uZAy0PdLm048At0XK0g/viewform" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; white-space:nowrap; font-family:'Inter',sans-serif; font-weight:800; font-size:13px; letter-spacing:.4px; color:#F4EBD8; background:#B8492F; border:2px solid #F4EBD8; box-shadow:2px 2px 0 #F4EBD8; padding:8px 14px; min-height:34px; line-height:1.2; transition:transform .12s ease, box-shadow .12s ease, background .12s ease;" style-hover="transform:translate(-1px,-1px); box-shadow:3px 3px 0 #F4EBD8; background:#C25233" data-sm-tight="1"><span>Join waitlist<span data-sm-hide="1"> for cohort 1</span>!!</span></a>
    </nav>
  </header>

  <section id="top" aria-labelledby="gal-title" style="position:relative; z-index:2; overflow:hidden; padding:clamp(52px,9vh,100px) clamp(20px,5vw,64px) clamp(30px,5vh,50px); background-color:#1F2F22; background-image:repeating-conic-gradient(from 0deg at 50% 50%, rgba(41,92,55,.13) 0deg 90deg, transparent 90deg 180deg); background-size:32px 32px;">
    <div style="position:relative; z-index:5; max-width:1120px; margin:0 auto;">
      <h1 id="gal-title" style="font-family:'VT323',monospace; font-size:clamp(28px,4vw,40px); color:#D5A945; letter-spacing:1.6px; margin:0; font-weight:400; text-align:center;">QUESTS GALLERY</h1>
      <p style="font-size:clamp(16px,2.1vw,19px); line-height:1.6; color:#B3C6B2; margin:14px auto 0; max-width:520px; text-align:center; text-wrap:pretty;">Connect with the side quest builders!</p>
      <div style="display:flex; justify-content:center; margin-top:22px;">
        <a href="Quest%20Day.dc.html" style="display:inline-flex; align-items:center; cursor:pointer; font-family:'Inter',sans-serif; font-weight:800; font-size:15px; color:#F4EBD8; background:#B8492F; border:3px solid #F4EBD8; box-shadow:4px 4px 0 #F4EBD8; padding:11px 22px; min-height:44px; line-height:1.3; transition:transform .12s ease, box-shadow .12s ease, background .12s ease;" style-hover="transform:translate(-2px,-2px); box-shadow:6px 6px 0 #F4EBD8; background:#C25233; color:#F4EBD8">RSVP Quest Day!</a>
      </div>
    </div>
  </section>

  <section aria-label="Side quests" style="position:relative; z-index:2; padding:clamp(24px,4vh,44px) clamp(16px,5vw,64px) clamp(70px,10vh,120px); background-color:#1F2F22; background-image:repeating-conic-gradient(from 0deg at 50% 50%, rgba(41,92,55,.13) 0deg 90deg, transparent 90deg 180deg); background-size:32px 32px;">
    <div style="max-width:1180px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:clamp(30px,4vw,52px) clamp(20px,3vw,38px); justify-items:center;">
      <sc-for list="{{ quests }}" as="q" hint-placeholder-count="10">
        <div style="position:relative; width:100%; max-width:290px; padding-top:16px;">
          <div style="position:relative; background:#FBF5E4; border:3px solid #2A3D2E; box-shadow:7px 7px 0 rgba(8,24,15,.4); padding:12px 12px 0; transform:{{ q.rot }}; transition:transform .18s ease, box-shadow .18s ease;" style-hover="transform:rotate(0deg) translateY(-6px); box-shadow:10px 12px 0 rgba(8,24,15,.45); z-index:6">
            <div aria-hidden="true" style="position:absolute; left:50%; top:-13px; width:18px; height:18px; margin-left:-9px; z-index:3;">
              <div style="position:absolute; left:0; top:6px; width:18px; height:6px; background:{{ q.pin }};"></div>
              <div style="position:absolute; left:6px; top:0; width:6px; height:6px; background:{{ q.pin }};"></div>
              <div style="position:absolute; left:6px; top:12px; width:6px; height:6px; background:#2A3D2E;"></div>
            </div>
            <div style="position:relative; aspect-ratio:1/1; background-color:#DCD2AC; background-image:repeating-linear-gradient(45deg, rgba(42,61,46,.14) 0 6px, transparent 6px 12px); border:2px solid #2A3D2E; display:flex; align-items:flex-end; justify-content:center; padding:10px;">
              <p style="font-family:'VT323',monospace; font-size:15px; letter-spacing:.8px; color:#5C6B54; margin:0; text-align:center;">DROP PHOTO HERE</p>
            </div>
            <div style="padding:14px 4px 18px;">
              <p style="font-size:15px; line-height:1.5; color:#566B57; margin:0; text-wrap:pretty;">{{ q.blurb }}</p>
              <p style="display:flex; flex-wrap:wrap; align-items:baseline; gap:7px; margin:11px 0 0;">
                <span style="font-family:'Inter',sans-serif; font-weight:800; font-size:16px; color:#2A3D2E;">{{ q.name }}</span>
                <a href="{{ q.url }}" target="_blank" rel="noopener" style="font-family:'VT323',monospace; font-size:19px; letter-spacing:.6px; color:#B8492F; border-bottom:2px solid #B8492F;" style-hover="color:#2A3D2E; border-color:#2A3D2E">{{ q.handle }}</a>
              </p>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section id="join" style="position:relative; z-index:2; text-align:center; padding:clamp(64px,10vh,120px) clamp(20px,5vw,64px) clamp(50px,7vh,80px); background-color:#1F2F22; background-image:repeating-conic-gradient(from 0deg at 50% 50%, rgba(41,92,55,.13) 0deg 90deg, transparent 90deg 180deg); background-size:32px 32px; border-top:3px solid #354B38;">
    <div style="position:relative; z-index:5; max-width:720px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:20px;">
      <img src="assets/tomato-hero.png" alt="" style="width:clamp(96px,14vw,130px); height:auto; image-rendering:pixelated;">
      <p style="font-family:'VT323',monospace; font-size:clamp(22px,2.8vw,27px); color:#D5A945; letter-spacing:1.6px; margin:0;">WANT YOUR OWN SIDE QUEST UP HERE?</p>
      <div style="display:flex; gap:14px; flex-wrap:wrap; justify-content:center;">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSe41BedRCd2ouJ6u03e3gESe2nb243uZAy0PdLm048At0XK0g/viewform" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; cursor:pointer; font-family:'Inter',sans-serif; font-weight:800; font-size:15px; color:#F4EBD8; background:transparent; border:3px solid #F4EBD8; box-shadow:4px 4px 0 rgba(244,236,214,.35); padding:11px 22px; min-height:44px; line-height:1.3; transition:transform .12s ease, box-shadow .12s ease, background .12s ease;" style-hover="transform:translate(-2px,-2px); box-shadow:6px 6px 0 rgba(244,236,214,.55); background:rgba(244,236,214,.12); color:#F4EBD8">Join waitlist!!</a>
      </div>
    </div>
    <footer style="position:relative; z-index:5; margin-top:clamp(56px,9vh,90px); padding-top:26px; border-top:2px solid #354B38; display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:center;">
      <p style="font-family:'Inter',sans-serif; font-weight:300; font-size:13px; color:#93AC93; line-height:2; margin:0;">FIND YOUR OWN PATH &middot; @SIDEQUESTCLUBSG</p>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;tiltPolaroids&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Pin board&quot;},&quot;blurbPlaceholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;one-liner about this side quest goes here&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pin board&quot;}}">
class Component extends DCLogic {
  static PEOPLE = [
    ['Ari', 'okiedokie.sg'],
    ['Arick', 'coeythewhitefluff'],
    ['Khadijah', 'bluberrywafflee'],
    ['Moe', 'packjourneyapp'],
    ['Rose', 'sowing_stories'],
    ['Roshni', 'the_rawsh-ow'],
    ['Vignesh', 'vig.iterates'],
    ['Wei Qiang & Rui Qian', 'bhaagg.boredgames'],
    ['Weihao', 'ngweihao_'],
    ['Xinyi', 'feetupheaddown']
  ];
  renderVals() {
    const rots = ['rotate(-2.4deg)', 'rotate(1.8deg)', 'rotate(-1.2deg)', 'rotate(2.6deg)', 'rotate(-3deg)', 'rotate(1.1deg)'];
    const pins = ['#B8492F', '#D5A945', '#587C5A', '#B8492F', '#D5A945'];
    const tilt = this.props.tiltPolaroids ?? true;
    const blurb = this.props.blurbPlaceholder ?? 'one-liner about this side quest goes here';
    return {
      quests: Component.PEOPLE.map((p, i) => ({
        name: p[0],
        handle: '@' + p[1],
        url: 'https://instagram.com/' + p[1],
        blurb: blurb,
        rot: tilt ? rots[i % rots.length] : 'rotate(0deg)',
        pin: pins[i % pins.length]
      }))
    };
  }
}
</script>
</body>
</html>
